name: Build and Deploy

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8am UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python fetch.py PL ELC PD BL1 SA FL1 DED PPL BSA

      - name: Run simulations
        run: |
          for league in PL ELC PD BL1 SA FL1 DED PPL BSA; do
            echo "=== $league ==="
            if [ "$league" = "ELC" ]; then
              python plmodel.py --fixtures data/$league.csv --html html/$league-predictions.html \
                --half-life 10 --iterations 100000 --top 6 --bottom 3
            else
              python plmodel.py --fixtures data/$league.csv --html html/$league-predictions.html \
                --half-life 10 --iterations 100000
            fi
          done

      - name: Generate index page
        run: python generate_index.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
